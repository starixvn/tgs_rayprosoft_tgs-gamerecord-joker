apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-joker-manualservice.fullname" . }}
  labels:
    {{- include "game-gamerecord-joker-manualservice.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameProvidersBaseUrl": "http://game-gameproviders"
      },
      "GameRecordInfo": {
        "GameProviderCode": "JOKER",
        "GameProviderConfiguration": "JOKERConfiguration",
        "IntervalMinuteMax": 60,
        "IntervalMinute": 20,
        "MongoDefine": "gp.gamerecord.database.manual",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.manual.joker"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }