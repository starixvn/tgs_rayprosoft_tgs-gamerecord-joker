apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-joker-service.fullname" . }}
  labels:
    {{- include "game-gamerecord-joker-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules",
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameProvidersBaseUrl": "http://game-gameproviders"
      },
      "GameRecordInfo": {
        "GameProviderCode": "JOKER",
        "GameProviderConfiguration": "JOKERConfiguration",
        "IntervalMinuteMax": 60,
        "IntervalMinute": 20
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }