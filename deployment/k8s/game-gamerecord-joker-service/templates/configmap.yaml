apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-joker-service.fullname" . }}
  labels:
    {{- include "game-gamerecord-joker-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Warning"
          }
      },
      "GameRecordInfo": {
        "GameProviderCode": "JOKER",
        "GameProviderConfiguration": "JOKERConfiguration",
        "IntervalMinutes": 20,
        "IntervalMinutesMax": 60,
        "IntervalMinutesMinimum": 11
      },
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameProvidersBaseUrl": "http://game-gameproviders/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }